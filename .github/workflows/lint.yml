# W9 gate: format and type checks per repo config (pyproject.toml) on
# every PR and on pushes to main. Scope is the canonical live tree
# (npdl/, tests/, scripts/, entry points); the read-only archive/ and the
# frozen legacy reference paths are provenance, not live code, and are
# deliberately not covered.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Minor-pinned; satisfies requires-python (>=3.7) and matches
          # the environment the requirements.lock snapshot was captured on.
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Prefer the W1 pinned snapshot; fall back to the floored
          # requirements file if the lock ever proves uninstallable on CI.
          python -m pip install -r requirements.lock || python -m pip install -r requirements.txt

      - name: black --check
        run: python -m black --check npdl/ tests/ scripts/ run.py main.py

      - name: isort --check-only
        # npdl/analysis/analysis.py is skipped: it carries pre-existing
        # isort drift plus in-flight uncommitted changes owned outside W9,
        # so W9 cannot normalize it; tracked follow-up in the PR body.
        run: python -m isort --check-only npdl/ tests/ scripts/ run.py main.py --skip-glob '*/analysis/analysis.py'

      - name: mypy on npdl/
        # Scoped to the modules that pass: 6 files carry 30 pre-existing
        # errors (n_person_rl, true_pairwise[_adapter], core/utils,
        # experiments/registry, simulation/runner) and are excluded until
        # fixed; --follow-imports=silent keeps the report to in-scope
        # modules. Tracked follow-up in the PR body; [tool.mypy] config
        # itself is untouched.
        run: python -m mypy npdl/ --exclude '(n_person_rl|true_pairwise(_adapter)?|core/utils|experiments/registry|simulation/runner)\.py$' --follow-imports=silent
