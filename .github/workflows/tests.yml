# W9 gate: full test suite on every PR and on pushes to main.
# Runs the stock command (pytest.ini is the canonical pytest config).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Minor-pinned; satisfies requires-python (>=3.7) and matches
          # the environment the requirements.lock snapshot was captured on.
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Prefer the W1 pinned snapshot; fall back to the floored
          # requirements file if the lock ever proves uninstallable on CI.
          python -m pip install -r requirements.lock || python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -q
